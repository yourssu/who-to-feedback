<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yourssu 피어리뷰 리포트 생성기</title>
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
  <header class="app-header">
    <div>
      <span class="app-kicker">YOURSSU HR · PEER REVIEW</span>
      <h1>피어리뷰 HTML · PDF 생성기</h1>
    </div>
    <div class="server-state"><span></span> 로컬 전용</div>
  </header>

  <main class="app-shell">
    <section class="tool-section upload-section">
      <div class="section-heading">
        <div><span class="step">1</span><h2>엑셀 파일 업로드</h2></div>
        <p>파일은 외부로 전송되지 않고 이 컴퓨터에서만 처리됩니다.</p>
      </div>
      <div class="upload-grid">
        <label class="upload-box">
          <span class="upload-title">data.xlsx</span>
          <span class="upload-copy">피어리뷰 응답 원본</span>
          <input id="dataFile" type="file" accept=".xlsx,.xls">
          <strong id="dataFileName">파일 선택</strong>
        </label>
        <label class="upload-box">
          <span class="upload-title">info.xlsx</span>
          <span class="upload-copy">대상자 팀·역할 기준표</span>
          <input id="infoFile" type="file" accept=".xlsx,.xls">
          <strong id="infoFileName">파일 선택</strong>
        </label>
      </div>
      <div class="actions-row">
        <button id="analyzeBtn" class="primary-button" disabled>파일 분석</button>
        <span id="analyzeStatus" class="status-text"></span>
      </div>
    </section>

    <section id="mappingSection" class="tool-section" hidden>
      <div class="section-heading">
        <div><span class="step">2</span><h2>열 연결 확인</h2></div>
        <p>자동 탐색 결과가 다르면 직접 변경할 수 있습니다.</p>
      </div>
      <div id="mappingGrid" class="mapping-grid"></div>
      <div id="infoMappingSummary" class="info-mapping-summary"></div>
    </section>

    <section id="memberSection" class="tool-section" hidden>
      <div class="section-heading">
        <div><span class="step">3</span><h2>대상자 및 생성 결과</h2></div>
        <p id="memberSummary"></p>
      </div>
      <div class="batch-actions">
        <button id="buildAllBtn" class="primary-button">전체 HTML · PDF 생성 후 ZIP 다운로드</button>
        <button id="cancelBtn" class="secondary-button" hidden>생성 취소</button>
      </div>
      <div id="progressWrap" class="progress-wrap" hidden>
        <div class="progress-track"><span id="progressBar"></span></div>
        <div id="progressText" class="progress-text"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>대상자 팀</th><th>이름</th><th>리뷰</th><th>키워드</th><th>info.xlsx 연결</th><th>작업</th></tr></thead>
          <tbody id="memberRows"></tbody>
        </table>
      </div>
    </section>

    <section id="validationSection" class="tool-section" hidden>
      <div class="section-heading">
        <div><span class="step">4</span><h2>검증 결과</h2></div>
        <p>오버플로·안전 여백·폰트·PDF 페이지를 확인합니다.</p>
      </div>
      <div id="validationSummary" class="validation-summary"></div>
      <div id="validationList" class="validation-list"></div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/assets/xlsx.full.min.js"></script>
  <script src="/assets/text-rules.js"></script>
  <script src="/assets/admin.js"></script>
</body>
</html>

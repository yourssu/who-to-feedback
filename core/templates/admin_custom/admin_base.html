{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}피어리뷰 관리자 센터{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .admin-layout {
            display: flex;
            min-height: calc(100vh - 70px);
        }
        .admin-sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid var(--gray-200);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .admin-nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--gray-700);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }
        .admin-nav-item:hover, .admin-nav-item.active {
            background: var(--primary-light);
            color: var(--primary);
        }
        .admin-content {
            flex: 1;
            padding: 2rem;
            background: var(--gray-50);
            overflow-y: auto;
        }
        .table-custom {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: #ffffff;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--gray-200);
        }
        .table-custom th, .table-custom td {
            padding: 0.85rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--gray-200);
            font-size: 0.95rem;
        }
        .table-custom th {
            background: var(--gray-100);
            font-weight: 700;
            color: var(--gray-700);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            background: #ffffff;
            border-radius: var(--radius-md);
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'admin_dashboard' %}" class="navbar-brand">
            ⚙️ Peer Review Admin Center
        </a>
        <div class="navbar-user">
            <a href="{% url 'review_dashboard' %}" class="btn-logout">👤 사용자 화면으로 가기</a>
        </div>
    </nav>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a href="{% url 'admin_dashboard' %}" class="admin-nav-item {% if active_menu == 'dashboard' %}active{% endif %}">
                📊 관리자 대시보드
            </a>
            <a href="{% url 'admin_members' %}" class="admin-nav-item {% if active_menu == 'members' %}active{% endif %}">
                👥 1. 팀원 관리
            </a>
            <a href="{% url 'admin_status' %}" class="admin-nav-item {% if active_menu == 'status' %}active{% endif %}">
                🚀 2. 진행 상태 & 회차 관리
            </a>
            <a href="{% url 'admin_send_message' %}" class="admin-nav-item {% if active_menu == 'messages' %}active{% endif %}">
                💬 3. Slack DM 메시지 발송
            </a>
        </aside>

        <section class="admin-content">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            {% block admin_content %}{% endblock %}
        </section>
    </div>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeerFlow UI preview</title>
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/preview.css">
</head>
<body>
  <main class="preview-stage">
    <section id="screen" class="preview-screen active" aria-live="polite"></section>
  </main>
  <div class="preview-toolbar" aria-label="화면 선택">
    <select id="screenSelect" class="form-control">
      <optgroup label="06 Reviewer · PC">
        <option value="rd-login">Login</option><option value="rd-login-error">Login Error</option><option value="rd-dashboard">Dashboard</option><option value="rd-dashboard-complete">Dashboard · All Complete</option><option value="rd-overview">Review · Overview</option><option value="rd-rating">Review · Rating</option><option value="rd-text">Review · Text</option><option value="rd-single">Review · Single Choice</option><option value="rd-multiple">Review · Multiple Choice</option><option value="rd-completed">Completed</option>
      </optgroup>
      <optgroup label="06 Reviewer · Mobile">
        <option value="r-login">Login</option><option value="r-login-error">Login Error</option><option value="r-dashboard">Dashboard</option><option value="r-dashboard-complete">Dashboard · All Complete</option><option value="r-overview">Review · Overview</option><option value="r-rating">Review · Rating</option><option value="r-text">Review · Text</option><option value="r-single">Review · Single Choice</option><option value="r-multiple">Review · Multiple Choice</option><option value="r-completed">Completed</option>
      </optgroup>
      <optgroup label="07 Admin · PC">
        <option value="ad-login">Admin Login</option><option value="a-overview">Dashboard</option><option value="a-members">Members</option><option value="a-questions">Questions</option><option value="a-assignments">Matching</option><option value="a-status">Status</option><option value="a-reports">Report Review</option><option value="a-messages">Slack DM</option>
      </optgroup>
      <optgroup label="08 Admin · Mobile">
        <option value="am-login">Admin Login</option><option value="am-navigation">Navigation</option><option value="am-overview">Dashboard</option><option value="am-members">Members</option><option value="am-questions">Questions</option><option value="am-assignments">Matching</option><option value="am-status">Status</option><option value="am-reports">Report Review</option><option value="am-messages">Slack DM</option>
      </optgroup>
    </select>
    <button class="icon-btn" id="themeToggle" aria-label="테마 전환">◐</button>
  </div>
  <script>
  (function(){
    var screen=document.getElementById('screen'), select=document.getElementById('screenSelect'), root=document.documentElement;
    root.dataset.theme=localStorage.getItem('peerflow-theme')||'light';
    function button(label,primary){return '<button class="btn '+(primary?'btn-primary':'')+'">'+label+'</button>'}
    function progress(value){return '<div class="progress-label"><span>리뷰 진행률</span><span>'+value+'%</span></div><div class="progress"><span style="width:'+value+'%"></span></div>'}
    function choices(multiple){if(multiple)return '<div class="option-group"><label class="option-item"><input type="checkbox" checked name="choice"><span>협업</span></label><label class="option-item"><input type="checkbox" checked name="choice"><span>커뮤니케이션</span></label><label class="option-item"><input type="checkbox" name="choice"><span>문제 해결</span></label><label class="option-item"><input type="checkbox" name="choice"><span>리더십</span></label></div>';return '<div class="option-group"><label class="option-item"><input type="radio" name="choice"><span>문제 상황을 먼저 구조화했어요</span></label><label class="option-item"><input type="radio" name="choice" checked><span>진행 상황을 투명하게 공유했어요</span></label><label class="option-item"><input type="radio" name="choice"><span>서로의 강점을 연결했어요</span></label></div>'}
    function ratings(){return '<div class="score-grid" data-preview-rating><span class="rating-option"><input type="radio" name="preview-rating" id="preview-rating-1" value="1"><label for="preview-rating-1">1</label></span><span class="rating-option"><input type="radio" name="preview-rating" id="preview-rating-2" value="2"><label for="preview-rating-2">2</label></span><span class="rating-option"><input type="radio" name="preview-rating" id="preview-rating-3" value="3" checked><label for="preview-rating-3">3</label></span><span class="rating-option"><input type="radio" name="preview-rating" id="preview-rating-4" value="4"><label for="preview-rating-4">4</label></span><span class="rating-option"><input type="radio" name="preview-rating" id="preview-rating-5" value="5"><label for="preview-rating-5">5</label></span><span class="rating-value" data-rating-value>3 / 5</span></div>'}
    function reviewerContent(kind,desktop){
      if(kind==='login')return '<p class="r-brand">PEERFLOW</p><h1 class="r-heading">피어리뷰를 시작해요</h1><p class="r-body">Slack DM으로 받은 6자리 PIN을 입력하면 바로 시작할 수 있어요.</p><div class="form-group"><label class="form-label">6자리 PIN</label><input class="form-control pin-input" placeholder="••••••"><span class="assistive">Slack DM에서 받은 코드를 입력하세요</span></div>'+button('확인',true)+'<div class="r-divider"></div><p class="r-caption">PIN을 받지 못했나요? Slack에서 PeerFlow 앱을 확인해 주세요.</p>';
      if(kind==='login-error')return '<p class="r-brand">PEERFLOW</p><h1 class="r-heading">PIN을 확인해 주세요</h1><p class="r-body">입력한 PIN이 만료되었거나 올바르지 않아요. Slack DM에서 새 PIN을 확인해 주세요.</p><div class="form-group"><label class="form-label">6자리 PIN</label><input class="form-control pin-input field-error" value="12845"><span class="assistive field-error-text">6자리 PIN을 다시 입력해 주세요</span></div>'+button('다시 확인',true)+button('PIN 다시 받기')+'<p class="r-caption">PIN은 회차 시작 시 발송된 Slack DM에서 확인할 수 있어요.</p>';
      if(kind==='dashboard'||kind==='dashboard-complete'){var done=kind==='dashboard-complete';return '<h1 class="r-title">'+(done?'모든 리뷰를 완료했어요':'안녕하세요, 김유어님')+'</h1><p class="r-body">'+(done?'내게 배정된 리뷰 · 제출률 100%':'내게 배정된 리뷰 3개 · 완료율 67%')+'</p>'+progress(done?100:67)+'<div class="banner reviewer-boundary">내게 배정된 리뷰만 확인하고 작성할 수 있어요.</div><h2 class="review-section-title">'+(done?'제출한 리뷰':'내게 배정된 리뷰')+'</h2><article class="r-card"><strong>박하나님 리뷰</strong><span>'+ (done?'제출 완료':'미작성 · 평가 4개')+'</span><small>'+ (done?'완료':'마감까지 2일')+'</small></article><article class="r-card"><strong>이준호님 리뷰</strong><span>'+ (done?'제출 완료':'완료 · 4 / 4 제출')+'</span><small>제출됨</small></article>'+button(done?'결과 대기 중':'진행 중인 리뷰 보기',!done)+(done?'<p class="r-caption">관리자가 결과를 검토한 뒤 Slack DM으로 PDF를 보내드려요.</p>':'')}
      if(kind==='overview')return '<a class="r-back">‹&nbsp;&nbsp;대시보드</a><p class="r-step">리뷰 작성 안내 · 총 4문항</p><h1 class="r-title">4개의 질문에 답해 주세요</h1><p class="r-help">답변을 차례대로 작성한 뒤 마지막 단계에서 제출합니다.</p>'+button('리뷰 시작',true);
      if(kind==='rating'){if(desktop)return '<h1 class="r-title">1. 협업 만족도</h1><p class="r-help">김민수님의 업무 협업을 1~5점으로 평가해주세요.</p>'+ratings()+button('저장하고 다음',true);return '<a class="r-back">‹&nbsp;&nbsp;대시보드</a><p class="r-step">1 / 4</p><h1 class="r-title">함께 일하며 좋았던 점을 5점으로 평가해 주세요</h1>'+ratings()+'<div class="scale-hints"><span>1 전혀 그렇지 않음</span><span>5 매우 그렇다</span></div>'+button('저장하고 다음',true)}
      if(kind==='text')return '<a class="r-back">‹&nbsp;&nbsp;이전 질문</a><p class="r-step">2 / 4 · TEXT</p><h1 class="r-title">구체적인 피드백을 남겨 주세요</h1><p class="r-help">상황과 행동을 중심으로 작성하면 동료에게 더 도움이 됩니다.</p><div class="form-group"><label>익명 피드백</label><textarea class="form-control" placeholder="함께 일하며 좋았던 점과 다음에 시도해 볼 점을 작성해 주세요."></textarea><span class="text-counter">0 / 500</span></div><div class="banner">피드백은 익명으로 종합 리포트에 반영됩니다.</div>'+button('저장하고 다음',true);
      if(kind==='single'||kind==='multiple')return '<a class="r-back">‹&nbsp;&nbsp;이전 질문</a><p class="r-step">'+(kind==='single'?'3 / 4 · SINGLE_CHOICE':'4 / 4 · MULTIPLE_CHOICE')+'</p><h1 class="r-title">'+(kind==='single'?'가장 도움이 된 협업 방식은 무엇인가요?':'함께한 경험을 모두 골라 주세요')+'</h1><p class="r-help">'+(kind==='single'?'하나만 선택할 수 있어요.':'여러 개를 선택할 수 있어요.')+'</p>'+choices(kind==='multiple')+(kind==='multiple'?'<div class="banner banner-warning">마감 전까지는 제출 후에도 답변을 수정할 수 있어요.</div>':'')+button(kind==='multiple'?'리뷰 제출':'저장하고 다음',true);
      return '<div class="success-icon">✓</div><h1 class="r-heading">제출했어요</h1><p class="r-body">리뷰가 안전하게 저장되었습니다. 다른 동료의 리뷰도 이어서 작성할 수 있어요.</p>'+button('대시보드로 돌아가기',false);
    }
    function reviewer(id){var desktop=id.indexOf('rd-')===0,kind=id.replace(/^r(d)?-/,'');var inner=reviewerContent(kind,desktop);if(!desktop)return '<section class="reviewer-screen">'+inner+'</section>';var dashboardActive=kind==='dashboard'||kind==='dashboard-complete';return '<section class="desktop-shell"><aside class="preview-sidebar"><strong>PEERFLOW</strong><span>리뷰 워크스페이스</span><nav><a href="#rd-overview" data-screen="rd-overview" class="'+(!dashboardActive?'active':'')+'">내 리뷰</a><a href="#rd-dashboard" data-screen="rd-dashboard" class="'+(dashboardActive?'active':'')+'">내 대시보드</a></nav><small>onehalf@soongsil.ac.kr</small></aside><article class="desktop-review-content"><div class="desktop-review-inner">'+inner+'</div></article></section>'}
    var adminNames={overview:'메인 대시보드',members:'팀원 관리',questions:'질문지 제작',assignments:'피어리뷰 매칭',status:'진행 상태',reports:'리포트 검토',messages:'Slack DM 전송'};
    var adminDescriptions={overview:'회차 생성부터 질문·매칭·진행·리포트 검토·발송까지 관리하세요.',members:'이름·이메일·Slack User ID·소속 부서를 등록하고 관리합니다.',questions:'문항 순서와 유형을 편집하고 동적 선택지를 관리합니다.',assignments:'관리자만 Reviewer–Reviewee 매칭을 만들고 ACTIVE 중에도 안전하게 수정합니다.',status:'회차 상태와 제출 현황을 확인하고 시작·리마인더·리포트 생성을 실행합니다.',reports:'익명 HTML 미리보기와 PDF 다운로드를 검토한 뒤 Slack DM 배포를 승인합니다.',messages:'특정 팀원·전체 팀원·회차 미작성자를 선택해 자유 메시지를 즉시 전송합니다.'};
    function adminNav(kind,mobile){return Object.keys(adminNames).map(function(key){var screen=(mobile?'am-':'a-')+key;return '<a href="#'+screen+'" data-screen="'+screen+'" class="'+(key===kind?'active':'')+'">'+adminNames[key]+'</a>'}).join('')}
    function adminBody(kind){
      if(kind==='overview')return '<div class="overview-cards"><article class="card overview-card"><strong>2026 상반기 피어리뷰</strong><span>ACTIVE · 24 / 36 제출 완료</span><small>마감까지 2일</small></article><article class="card overview-card"><strong>생성된 리포트 12개</strong><span>COMPLETED · 익명 HTML/PDF 준비 완료</span><small>승인 후 Slack DM 배포</small></article><article class="quick-card"><strong>빠른 작업</strong>'+button('미작성자 리마인더')+button('리포트 검토')+'</article></div><article class="card cycle-progress"><h2 class="card-title">2026 상반기 피어리뷰 진행률</h2><span class="badge badge-info">진행중</span>'+progress(100)+'<small>마지막 동기화 2분 전 · 3명의 미작성자</small></article><div class="banner">전원 제출 완료 시 COMPLETED로 전환되며 결과 리포트 생성을 시작할 수 있습니다.</div>';
      if(kind==='members')return '<div class="member-columns"><article class="card member-list"><h2 class="card-title">팀원 12명</h2><div class="member-row"><strong>김유어</strong><span>onehalf@soongsil.ac.kr</span><small>U01820001 · Product Design</small></div><div class="member-row"><strong>박하나</strong><span>hana@soongsil.ac.kr</span><small>U01820002 · Product Design</small></div><div class="member-row"><strong>이준호</strong><span>junho@soongsil.ac.kr</span><small>U01820003 · Engineering</small></div></article><article class="card member-add"><h2 class="card-title">새 팀원 추가</h2><div class="form-group"><label class="form-label">이름</label><input class="form-control" placeholder="김유어"></div><div class="form-group"><label class="form-label">이메일</label><input class="form-control" placeholder="name@soongsil.ac.kr"></div><div class="form-group"><label class="form-label">Slack User ID</label><input class="form-control" placeholder="U01234567"><small>U로 시작하는 9자리 ID</small></div><div class="form-group"><label class="form-label">소속 부서</label><input class="form-control" placeholder="Product Design"><small>팀 또는 부서명을 입력하세요</small></div>'+button('저장')+'</article></div>';
      if(kind==='questions')return '<div class="question-actions"><span class="badge">초안 · 편집 가능</span>'+button('저장',true)+'</div><div class="banner banner-warning">RATING 척도: NUMERIC_5 또는 TEXT_5</div><article class="card question-builder"><div class="section-head"><h2 class="card-title">총 4개 문항</h2>'+button('문항 추가')+'</div><div class="question-preview-row"><strong>01</strong><div><span>RATING</span><p>함께 일하며 좋았던 점을 5점으로 평가해 주세요</p><small>NUMERIC_5 · 숫자 1–5</small></div>'+button('편집')+'</div><div class="question-preview-row"><strong>02</strong><div><span>TEXT</span><p>구체적인 피드백을 남겨 주세요</p><small>최대 500자</small></div>'+button('편집')+'</div><div class="question-preview-row"><strong>03</strong><div><span>SINGLE_CHOICE</span><p>가장 도움이 된 협업 방식은 무엇인가요?</p><small>선택지 3개</small></div>'+button('편집')+'</div><div class="question-preview-row"><strong>04</strong><div><span>MULTIPLE_CHOICE</span><p>함께한 경험을 모두 골라 주세요</p><small>선택지 4개</small></div>'+button('편집')+'</div></article>';
      if(kind==='assignments')return '<div class="banner">현재 12명 · 36개 매칭을 구성할 수 있습니다.</div><article class="card"><div class="section-head"><h2 class="card-title">매칭 매트릭스</h2>'+button('그룹 매칭')+'</div><div class="data-list"><div class="list-row"><strong>김유어</strong><span>✓&nbsp; 박하나 · 이준호</span>'+button('삭제')+'</div><div class="list-row"><strong>박하나</strong><span>✓&nbsp; 김유어 · 이준호</span>'+button('삭제')+'</div><div class="list-row"><strong>이준호</strong><span>✓&nbsp; 김유어 · 박하나</span>'+button('삭제')+'</div></div></article><div class="banner">ACTIVE 중 매칭 수정 가능 · 신규 리뷰어에게 6자리 PIN DM 자동 발송</div>';
      if(kind==='status')return '<div class="head-actions"><span class="badge badge-info">진행중</span>'+button('미작성자 Slack DM 리마인더',true)+'</div><div class="banner banner-warning">미작성자 3명 · 김유어 → 박하나, 이준호 / 박하나 → 김유어</div><article class="card cycle-progress"><h2 class="card-title">현재 24 / 36개 제출 완료 · 67%</h2><div class="progress"><span style="width:67%"></span></div><div class="data-list"><div class="list-row"><strong>김유어</strong><span>박하나</span><span>2 / 3</span><span class="badge badge-warning">미작성</span></div><div class="list-row"><strong>박하나</strong><span>김유어</span><span>3 / 3</span><span class="badge badge-success">완료</span></div><div class="list-row"><strong>이준호</strong><span>김유어</span><span>1 / 3</span><span class="badge badge-warning">미작성</span></div></div></article><div class="banner">DRAFT → ACTIVE → COMPLETED → CLOSED · 전원 제출 후에만 결과 리포트를 생성할 수 있습니다.</div><button class="btn btn-block" disabled>피어리뷰 시작 · DRAFT에서 6자리 PIN DM 전송</button>';
      if(kind==='reports')return '<div class="report-workspace"><section class="card report-list-card"><h2 class="card-title">수신자별 리포트</h2><p class="card-subtitle">HTML 미리보기와 PDF 파일을 함께 확인합니다.</p><article class="report-recipient"><strong>박하나</strong><span>PDF 준비 완료</span><small>선택됨</small></article><article class="report-recipient"><strong>Glen</strong><span>PDF 준비 완료</span><small>PDF 다운로드</small></article><article class="report-recipient"><strong>김유어</strong><span>PDF 준비 완료</span><small>PDF 다운로드</small></article><p class="assistive">12명 · 생성일 2026.08.01</p></section><section class="card report-preview-card"><div class="section-head"><h2 class="card-title">박하나 · 수신자 웹 미리보기</h2><small>익명 HTML</small></div><div class="report-document"><h3>2026 상반기 피어리뷰 결과</h3><strong>협업 만족도 평균 4.3 / 5.0</strong><h4>서술형 피드백</h4><p>“문제를 구조화해 팀이 빠르게 합의할 수 있도록 도와주었어요.”</p><p>“진행 상황을 투명하게 공유해 협업 흐름을 안정적으로 만들었습니다.”</p><h4>선택 응답</h4><span>문제 구조화</span><span>진행 공유</span><span>강점 연결</span></div><div class="banner"><div><strong>수신자에게 작성자 정보가 노출되지 않습니다.</strong><br><small>리뷰어 응답은 익명으로 종합됩니다.</small></div></div></section></div><section class="card report-pdf-summary"><div><h2 class="card-title">박하나_peer_review_report.pdf</h2><p class="assistive">2026.08.01 생성 · 2.4 MB · HTML 미리보기와 동일한 익명 내용</p></div>'+button('PDF 미리보기')+button('PDF 다운로드',true)+'</section>';

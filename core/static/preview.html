<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PeerFlow Actual UI Preview</title>
  <link rel="stylesheet" href="css/preview.css">
  <link rel="stylesheet" href="css/preview-controls.css">
</head>
<body class="preview-host">
  <main class="preview-stage">
    <iframe id="previewFrame" title="PeerFlow 실제 화면"></iframe>
  </main>
  <aside class="preview-toolbar" id="previewToolbar" aria-label="미리보기 설정">
    <label><span>화면</span><select id="screenSelect">
      <optgroup label="리뷰어">
        <option value="reviewer-login">로그인 · 기본</option>
        <option value="reviewer-login-error">로그인 · PIN 오류</option>
        <option value="reviewer-dashboard">내 리뷰 · 진행 중</option>
        <option value="reviewer-complete">내 리뷰 · 모두 완료</option>
        <option value="reviewer-form">리뷰 작성 · 전체 문항</option>
        <option value="reviewer-locked">리뷰 작성 · 마감 잠금</option>
      </optgroup>
      <optgroup label="관리자">
        <option value="admin-login">관리자 로그인</option>
        <option value="admin-overview">Overview</option>
        <option value="admin-members">팀원 관리</option>
        <option value="admin-validation">데이터 검증</option>
        <option value="admin-questions">질문지 제작</option>
        <option value="admin-matching">리뷰 매칭</option>
        <option value="admin-status">진행 상태</option>
        <option value="admin-reports">리포트 관리</option>
        <option value="admin-slack">Slack DM</option>
      </optgroup>
    </select></label>
    <div class="preview-segment" role="group" aria-label="뷰포트">
      <button class="active" type="button" data-width="desktop">현재 화면</button>
      <button type="button" data-width="mobile">모바일 390</button>
    </div>
    <button class="preview-theme" id="themeToggle" type="button" aria-label="다크 모드로 전환">◐</button>
  </aside>
  <script>
  (function () {
    var frame = document.getElementById('previewFrame');
    var select = document.getElementById('screenSelect');
    var styleUrl = new URL('css/style.css', location.href).href;
    var appUrl = new URL('js/app.js', location.href).href;
    var mode = 'desktop';
    var theme = 'light';

    function reviewerSidebar() {
      return '<aside class="sidebar"><a class="brand" href="#"><strong>PeerFlow</strong><span>YOURSSU PEER REVIEW</span></a><nav class="side-nav" aria-label="리뷰어 메뉴"><a class="side-link active" href="#"><span class="nav-icon" aria-hidden="true">□</span>내 리뷰</a><span class="side-link" aria-disabled="true"><span class="nav-icon" aria-hidden="true">○</span>알림</span></nav><div class="side-bottom"><div class="user-chip"><strong>김유어</strong><span>onehalf@soongsil.ac.kr</span></div><div class="side-actions"><button class="icon-btn" type="button" data-theme-toggle aria-label="다크 모드로 전환">◐</button><a class="icon-btn" href="#" aria-label="로그아웃">↗</a></div></div></aside>';
    }
    function adminSidebar(active) {
      var links = [['overview','◇','Overview'],['members','○','팀원 관리'],['validation','✓','데이터 검증'],['questions','□','질문지 제작'],['matching','↔','리뷰 매칭'],['status','◫','진행 상태'],['reports','▤','리포트 관리'],['slack','↗','Slack DM']];
      return '<aside class="sidebar"><a class="brand" href="#"><strong>PeerFlow</strong><span>YOURSSU ADMIN</span></a><nav class="side-nav" aria-label="관리자 메뉴">'+links.map(function(x){return '<a class="side-link '+(x[0]===active?'active':'')+'" href="#"><span class="nav-icon" aria-hidden="true">'+x[1]+'</span>'+x[2]+'</a>'}).join('')+'</nav><div class="side-bottom"><div class="user-chip"><strong>PeerFlow 관리자</strong><span>onehalf</span></div><div class="side-actions"><button class="icon-btn" type="button" data-theme-toggle aria-label="다크 모드로 전환">◐</button><a class="icon-btn" href="#" aria-label="리뷰어 화면">↗</a></div></div></aside>';
    }
    function mobileBar(admin) {
      return '<header class="mobile-bar"><a class="mobile-brand" href="#">PeerFlow'+(admin?' <small>Admin</small>':'')+'</a><div class="mobile-actions"><button class="icon-btn" type="button" data-theme-toggle aria-label="다크 모드로 전환">◐</button><a class="icon-btn" href="#" aria-label="화면 전환">↗</a></div></header>';
    }
    function mobileAdminNav(active) {
      var links = [['overview','Overview'],['members','팀원'],['validation','검증'],['questions','질문지'],['matching','매칭'],['status','진행'],['reports','리포트'],['slack','Slack DM']];
      return '<nav class="mobile-admin-nav mobile-only" aria-label="모바일 관리자 메뉴">'+links.map(function(x){return '<a class="'+(active===x[0]?'active':'')+'" href="#">'+x[1]+'</a>'}).join('')+'</nav>';
    }
    function appShell(content, admin, active) {
      return '<div class="app-shell">'+(admin?adminSidebar(active):reviewerSidebar())+mobileBar(admin)+'<main class="page"><div class="page-inner">'+(admin?mobileAdminNav(active):'')+content+'</div></main></div>';
    }
    function documentHtml(bodyClass, content, admin, active) {
      return '<!doctype html><html lang="ko" data-theme="'+theme+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PeerFlow Preview</title><link rel="stylesheet" href="'+styleUrl+'"></head><body class="'+bodyClass+'">'+appShell(content,admin,active)+'<script src="'+appUrl+'"><'+'/script></body></html>';
    }
    function authContent(admin, error) {
      var reviewerTitle = error ? 'PIN을 다시 확인해 주세요' : 'Slack PIN으로 로그인';
      var reviewerCopy = error ? '입력한 PIN이 만료되었거나 올바르지 않아요. Slack DM에서 최신 PIN을 확인해 주세요.' : 'Slack DM으로 받은 6자리 PIN을 입력하면 내 리뷰 공간으로 이동합니다.';
      return '<section class="login-wrap '+(admin?'admin-login-wrap':'')+'"><div class="login-story desktop-only" aria-hidden="true"><div class="login-story-copy"><span class="eyebrow">YOURSSU · '+(admin?'ADMIN':'PEER REVIEW')+'</span><h1 class="login-title">'+(admin?'리뷰의 시작부터<br>전달까지 한 흐름으로.':'서로의 성장을<br>더 선명하게.')+'</h1><p class="login-copy">'+(admin?'질문과 매칭, 진행 상황과 결과 발송을 차분하고 정확하게 운영합니다.':'함께 일한 경험을 정돈하고, 다음 협업을 위한 의미 있는 피드백으로 연결합니다.')+'</p></div><div class="login-story-note"><strong>'+(admin?'PeerFlow Operation Center':'Private by design')+'</strong><span>'+(admin?'관리자 전용 워크스페이스':'배정된 리뷰와 익명화된 결과만 안전하게 확인해요.')+'</span></div></div><div class="login-panel"><a class="auth-brand" href="#"><strong>PeerFlow</strong><span>YOURSSU '+(admin?'ADMIN':'PEER REVIEW')+'</span></a><span class="status-pill '+(error?'status-pill-error':'')+'">'+(admin?'관리자 전용':error?'PIN 확인 필요':'안전한 리뷰 공간')+'</span><h1 class="login-title">'+(admin?'관리자 로그인':reviewerTitle)+'</h1><p class="login-copy">'+(admin?'Django Superuser 계정으로 로그인해 주세요.':reviewerCopy)+'</p>'+(error?'<div class="alert alert-error" role="alert">입력한 PIN을 확인해 주세요.</div>':'')+'<form><div class="form-group"><label class="form-label" for="login-id">'+(admin?'관리자 아이디':'6자리 PIN')+'</label><input class="form-control '+(admin?'':'pin-input')+(error?' field-error':'')+'" id="login-id" '+(error?'value="12845" aria-invalid="true"':'placeholder="'+(admin?'관리자 아이디':'6자리 PIN을 입력하세요')+'"')+'><span class="assistive '+(error?'field-error-text':'')+'">'+(admin?'관리자 계정 정보를 입력해 주세요.':error?'Slack DM에 가장 최근에 도착한 PIN을 입력해 주세요.':'PIN은 회차 시작 시 Slack DM으로 전송됩니다.')+'</span></div>'+(admin?'<div class="form-group"><label class="form-label" for="password">비밀번호</label><input class="form-control" id="password" type="password" placeholder="비밀번호"></div>':'')+'<button class="btn btn-primary btn-block" type="submit">'+(admin?'관리자 센터 로그인':error?'다시 로그인':'로그인')+'</button></form>'+(admin?'<a class="btn btn-ghost btn-block admin-login-back" href="#">리뷰어 PIN 로그인으로</a>':'<div class="banner login-guide">PIN을 받지 못했나요? Slack에서 PeerFlow 앱과 관리자 메시지를 확인해 주세요.</div>')+'</div></section>';
    }
    function reviewCards(done) {
      var first = '<article class="r-card '+(done?'':'r-card-active')+'"><div class="r-card-top"><strong>박하나님 리뷰</strong><span class="badge '+(done?'badge-success':'badge-warning')+'">'+(done?'완료':'작성 필요')+'</span></div><span>'+(done?'모든 질문에 답변했어요':'질문 4개 · 마감 08.15')+'</span>'+(done?'<small>제출 완료</small>':'<a class="card-link" href="#">리뷰 작성하기 <span>→</span></a>')+'</article>';
      return first+'<article class="r-card"><div class="r-card-top"><strong>이준호님 리뷰</strong><span class="badge badge-success">완료</span></div><span>모든 질문에 답변했어요</span><small>제출 완료</small></article>';
    }
    function dashboardContent(done) {
      var rate = done ? 100 : 50;
      return '<section class="dashboard-mobile mobile-only"><span class="eyebrow">2026 하반기 피어리뷰</span><h1 class="r-title">'+(done?'모든 리뷰를 완료했어요':'안녕하세요, 김유어님')+'</h1><p class="r-body">'+(done?'정성스럽게 남긴 피드백이 동료의 다음 성장을 돕습니다.':'내게 배정된 리뷰 2개 중 1개를 완료했어요.')+'</p><div class="progress-block"><div class="progress-label"><span>전체 진행률</span><strong>'+rate+'%</strong></div><div class="progress"><span style="width:'+rate+'%"></span></div></div><div class="banner">내게 배정된 리뷰만 표시됩니다. 작성한 답변은 익명으로 결과에 반영돼요.</div><h2 class="dashboard-section-title">내 리뷰</h2><div class="stack">'+reviewCards(done)+'</div>'+(done?'<div class="banner banner-success">관리자 검토가 끝나면 결과를 Slack DM으로 안내해 드려요.</div>':'')+'</section><section class="dashboard-desktop desktop-only"><div class="desktop-reviewer-top"><div><span class="eyebrow">2026 하반기 피어리뷰</span><h1>내 리뷰</h1><p class="page-description">함께한 경험을 돌아보고 동료의 다음 성장을 위한 피드백을 남겨 주세요.</p></div><span class="badge '+(done?'badge-success':'badge-info')+'">'+(done?'모두 완료':'리뷰 진행 중')+'</span></div><div class="dashboard-summary card"><div><span class="summary-label">완료한 리뷰</span><strong>'+(done?'2':'1')+'<small> / 2</small></strong></div><div class="summary-progress"><div class="progress-label"><span>전체 진행률</span><strong>'+rate+'%</strong></div><div class="progress"><span style="width:'+rate+'%"></span></div></div><p>'+(done?'모든 리뷰를 제출했어요. 결과가 준비되면 Slack으로 알려드릴게요.':'작성 중인 답변은 임시 저장할 수 있어요. 마감은 2026.08.15 18:00입니다.')+'</p></div><h2 class="dashboard-section-title">배정된 리뷰</h2><div class="dashboard-card-grid">'+reviewCards(done)+'</div></section>';
    }
    function reviewFormContent(locked) {
      if (locked) return '<header class="page-head review-page-head"><div><span class="eyebrow">2026 하반기 피어리뷰</span><h1 class="page-title">박하나님 리뷰</h1><p class="page-description">마감된 리뷰의 답변은 수정할 수 없어요.</p></div><a class="btn btn-ghost" href="#">목록으로</a></header><section class="card card-raised empty-state locked-state"><span class="status-pill status-pill-warning">수정 마감</span><h2 class="card-title">제출한 리뷰가 잠겼어요</h2><p class="card-subtitle">회차 마감 이후에는 제출한 답변을 수정할 수 없습니다.</p><a class="btn btn-primary" href="#">내 리뷰로 돌아가기</a></section>';
      var rating='<section class="wizard-step question-box wizard-surface"><a class="r-back" href="#">‹&nbsp;&nbsp;대시보드</a><p class="question-kicker">1 / 4 · RATING</p><h2 class="question-title">함께 일하며 좋았던 점을 5점으로 평가해 주세요</h2><p class="r-help">업무 협업 경험을 기준으로 선택해 주세요.</p><div class="score-grid">'+[1,2,3,4,5].map(function(n){return '<div class="rating-option"><input type="radio" name="rating" id="rate-'+n+'" value="'+n+'" required><label for="rate-'+n+'">'+n+'점</label></div>'}).join('')+'<span class="rating-value" data-rating-value>0 / 5</span></div><div class="wizard-actions"><button class="btn btn-primary" type="button" data-wizard-next>저장하고 다음</button></div></section>';
      var text='<section class="wizard-step question-box wizard-surface"><button class="r-back btn-ghost" type="button" data-wizard-prev>‹&nbsp;&nbsp;이전 질문</button><p class="question-kicker">2 / 4 · TEXT</p><h2 class="question-title">구체적인 피드백을 남겨 주세요</h2><p class="r-help">상황과 행동을 중심으로 작성하면 동료에게 더 도움이 됩니다.</p><label class="card-title" for="feedback">익명 피드백</label><textarea class="form-control" id="feedback" rows="6" maxlength="500" data-count="#feedback-count" required></textarea><div class="text-counter"><span id="feedback-count">0</span> / 500</div><div class="banner question-banner">응답은 익명으로 집계됩니다.</div><div class="wizard-actions"><button class="btn btn-tonal mobile-only" type="button" data-save-draft>임시 저장</button><button class="btn btn-primary" type="button" data-wizard-next>저장하고 다음</button></div></section>';
      var single='<section class="wizard-step question-box wizard-surface"><button class="r-back btn-ghost" type="button" data-wizard-prev>‹&nbsp;&nbsp;이전 질문</button><p class="question-kicker">3 / 4 · SINGLE_CHOICE</p><h2 class="question-title">가장 도움이 된 협업 방식은 무엇인가요?</h2><p class="r-help">하나만 선택할 수 있어요.</p><div class="option-group"><label class="option-item"><input type="radio" name="single" required><span>문제 상황을 먼저 구조화했어요</span></label><label class="option-item"><input type="radio" name="single"><span>진행 상황을 투명하게 공유했어요</span></label></div><div class="wizard-actions"><button class="btn btn-primary" type="button" data-wizard-next>저장하고 다음</button></div></section>';
      var multi='<section class="wizard-step question-box wizard-surface"><button class="r-back btn-ghost" type="button" data-wizard-prev>‹&nbsp;&nbsp;이전 질문</button><p class="question-kicker">4 / 4 · MULTIPLE_CHOICE</p><h2 class="question-title">함께한 경험을 모두 골라 주세요</h2><p class="r-help">여러 개를 선택할 수 있어요.</p><div class="option-group"><label class="option-item"><input type="checkbox"><span>협업</span></label><label class="option-item"><input type="checkbox"><span>커뮤니케이션</span></label><label class="option-item"><input type="checkbox"><span>문제 해결</span></label></div><div class="wizard-actions"><button class="btn btn-primary" type="submit">리뷰 제출</button></div></section>';
      return '<header class="page-head review-page-head"><div><span class="eyebrow">2026 하반기 피어리뷰</span><h1 class="page-title">박하나님 리뷰</h1><p class="page-description">총 4개의 질문에 차례대로 답해 주세요.</p></div><a class="btn btn-ghost" href="#">목록으로</a></header><form class="wizard" data-review-wizard><div class="wizard-progress-shell"><div class="progress-label"><span>작성 진행률</span><span><span data-current-step>0</span> / 4</span></div><div class="progress"><span data-wizard-progress style="width:0"></span></div></div><section class="wizard-overview card card-raised wizard-surface"><a class="r-back" href="#">‹&nbsp;&nbsp;대시보드</a><p class="question-kicker question-kicker-spaced">리뷰 작성 안내 · 총 4문항</p><h2 class="question-title">4개의 질문에 답해 주세요</h2><p class="r-help">답변을 차례대로 작성한 뒤 마지막 단계에서 제출합니다.</p><div class="actions wizard-start-actions"><button class="btn btn-primary" type="button" data-wizard-start>리뷰 시작</button></div></section>'+rating+text+single+multi+'</form>';
    }
    function adminHeader(kicker,title,copy,action) {
      return '<header class="page-head"><div><span class="eyebrow">'+kicker+'</span><h1 class="page-title">'+title+'</h1><p class="page-description">'+copy+'</p></div>'+(action||'')+'</header>';
    }
    function tabs(active) {
      return '<nav class="tabs" aria-label="회차 설정 단계">'+[['questions','1. 질문지'],['matching','2. 리뷰어 매칭'],['status','3. 진행 상태'],['reports','4. 결과 리포트']].map(function(x){return '<a class="tab '+(active===x[0]?'active':'')+'" href="#">'+x[1]+'</a>'}).join('')+'</nav>';
    }
    function metric(label,value,copy) { return '<article class="card metric"><span class="metric-label">'+label+'</span><strong class="metric-value">'+value+'</strong><p class="card-subtitle">'+copy+'</p></article>'; }

      var cycle=function(state,title,rate,submitted,total,reports){return '<article class="card cycle-item"><div class="cycle-item-main"><div><span class="status-pill '+(state==='진행 중'?'status-pill-success':state==='종료'?'status-pill-muted':'')+'">'+state+'</span><h3 class="card-title">'+title+'</h3><p class="card-subtitle">2026.08.01 09:00 — 2026.08.15 18:00 · v2</p></div><div class="cycle-item-progress"><strong>'+rate+'%</strong><div class="progress"><span style="width:'+rate+'%"></span></div><small>'+submitted+' / '+total+' 제출 · 리포트 '+reports+'개</small></div></div><div class="cycle-actions"><a class="btn btn-small" href="#">질문지</a><a class="btn btn-small" href="#">매칭</a><a class="btn btn-small" href="#">진행 상태</a><a class="btn btn-small" href="#">리포트</a><a class="btn btn-ghost btn-small" href="#">변경 이력</a></div></article>'};

    function afterLoad() {
      var doc = frame.contentDocument;
      if (!doc) return;
      doc.documentElement.dataset.theme = theme;
      doc.querySelectorAll('a[href="#"]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault()})});
      doc.querySelectorAll('form').forEach(function(form){form.addEventListener('submit',function(e){e.preventDefault()})});
      var message = doc.getElementById('messageText'), preview = doc.getElementById('messagePreview');
      if (message && preview) message.addEventListener('input',function(){preview.textContent=message.value});
    }
    function render() {
      frame.style.width = mode === 'desktop' ? '100%' : 'min(390px, 100%)';
      frame.srcdoc = screens[select.value]();
    }
    frame.addEventListener('load',afterLoad);
    select.addEventListener('change',render);
    document.querySelectorAll('[data-width]').forEach(function(button){button.addEventListener('click',function(){mode=button.dataset.width;document.querySelectorAll('[data-width]').forEach(function(x){x.classList.toggle('active',x===button)});render()})});
    document.getElementById('themeToggle').addEventListener('click',function(){theme=theme==='dark'?'light':'dark';this.textContent=theme==='dark'?'☀':'◐';this.setAttribute('aria-label',theme==='dark'?'라이트 모드로 전환':'다크 모드로 전환');if(frame.contentDocument)frame.contentDocument.documentElement.dataset.theme=theme});

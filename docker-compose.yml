services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peerflow_web
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
    volumes:
      - ./data:/app/data
      - ./media:/app/media



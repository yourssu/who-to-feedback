          $ref: "#/components/responses/PayloadTooLargeError"

  /api/reviewer/assignments/{assignmentId}/submit:
    post:
      tags: [reviewer]
      operationId: submitReviewerAssignment
      summary: 리뷰 답변 최종 제출
      description: 전체 문항 필수 응답 검증 및 원자적 저장 (제출 후 수정 불가)
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/AssignmentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAnswersInput"
      responses:
        "200":
          description: 최종 제출 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSummary"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/media/questions/{questionId}/image:
    get:
      tags: [media]
      operationId: getQuestionImage
      summary: 문항 첨부 이미지 조회
      description: R2 문항 이미지 스트리밍 반환 (관리자 또는 해당 회차 리뷰어 전용)
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestionIdPath"
      responses:
        "200":
          description: 이미지 바이너리 반환
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: peerflow_session
      description: 세션 인증 쿠키 (HttpOnly, Secure, SameSite=Lax)
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 상태 변경 요청용 CSRF 토큰 헤더

  headers:
    SetSessionCookie:
      description: 세션 쿠키 설정 헤더 (peerflow_session)
      schema:
        type: string

  parameters:
    MemberIdPath:
      name: memberId
      in: path
      required: true
      description: 팀원 ID
      schema:
        type: integer
        minimum: 1
    CycleIdPath:
      name: cycleId
      in: path
      required: true
      description: 회차 ID
      schema:
        type: integer
        minimum: 1
    QuestionIdPath:
      name: questionId
      in: path
      required: true
      description: 문항 ID
      schema:
        type: integer
        minimum: 1
    OptionIdPath:
      name: optionId
      in: path
      required: true
      description: 선택지 ID
      schema:
        type: integer
        minimum: 1
    AssignmentIdPath:
      name: assignmentId
      in: path
      required: true
      description: 리뷰 매칭 ID
      schema:
        type: integer
        minimum: 1
    ReportIdPath:
      name: reportId
      in: path
      required: true
      description: 리포트 ID
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequestError:
      description: 요청 파라미터 또는 입력값 검증 실패
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: 미인증 또는 만료된 세션·PIN
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: 접근 권한 없음 또는 CSRF 토큰 불일치
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: 대상 리소스 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: 리소스 중복 또는 허용되지 않는 상태 전이
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLargeError:
      description: 업로드 파일 또는 본문 크기 초과
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequestsError:
      description: 로그인 연속 실패 잠금 (15분)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    CycleStatus:
      type: string
      enum: [DRAFT, ACTIVE, COMPLETED, CLOSED]
      description: 회차 상태

    QuestionType:
      type: string
      enum: [RATING, TEXT, SINGLE_CHOICE, MULTIPLE_CHOICE]
      description: 문항 유형

    ScaleType:
      type: string
      enum: [NUMERIC_5, TEXT_5]
      description: 5점 척도 표기 방식

    GenerationStatus:
      type: string
      enum: [PENDING, READY, FAILED]
      description: 리포트 생성 상태

    ApprovalStatus:
      type: string
      enum: [NEEDS_REVIEW, APPROVED, SENT]
      description: 리포트 승인·발송 상태

    DeliveryType:
      type: string
      enum: [PIN_ISSUE, REMINDER, REPORT]
      description: Slack DM 발송 유형

    DeliveryStatus:
      type: string
      enum: [PENDING, SENT, FAILED]
      description: Slack DM 발송 상태

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          examples: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, STATE_CONFLICT, RATE_LIMITED]
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, reason]
            properties:
              field:
                type: string
              reason:
                type: string

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, timestamp]
      properties:
        status:
          type: string
          const: ok
        timestamp:
          type: string
          format: date-time

    SetupStatusResponse:
      type: object
      additionalProperties: false
      required: [needs_setup]
      properties:
        needs_setup:
          type: boolean

    InitialAdminSetupRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 200

    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
        password:
          type: string
          minLength: 1
          maxLength: 200

    ReviewerPinLoginRequest:
      type: object
      additionalProperties: false
      required: [pin_code]
      properties:
        pin_code:
          type: string
          pattern: "^[0-9]{6}$"
          description: 6자리 숫자 PIN 코드

    SessionResponse:
      type: object
      additionalProperties: false
      required: [role, csrf_token, expires_at]
      properties:
        role:
          type: string
          enum: [ADMIN, REVIEWER]
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
        admin:
          type: ["object", "null"]
          additionalProperties: false
          required: [id, username, email]
          properties:
            id:
              type: integer
            username:
              type: string
            email:
              type: string
              format: email
        reviewer:
          type: ["object", "null"]
          additionalProperties: false
          required: [member_id, name, department, cycle_id, cycle_title]
          properties:
            member_id:
              type: integer
            name:
              type: string
            department:
              type: string
            cycle_id:
              type: integer
            cycle_title:
              type: string

    Member:
      type: object
      additionalProperties: false
      required: [id, name, email, department, slack_user_id, created_at, updated_at]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        email:
          type: string
          format: email
        department:
          type: string
        slack_user_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemberListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    CreateMemberRequest:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        department:
          type: string
          maxLength: 100
          default: ""
        slack_user_id:
          type: string
          maxLength: 50
          default: ""

    CsvImportResultResponse:
      type: object
      additionalProperties: false
      required: [created_count, updated_count]
      properties:
        created_count:
          type: integer
          minimum: 0
        updated_count:
          type: integer
          minimum: 0

    CsvValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, row_index, reason]
      properties:
        code:
          type: string
          const: CSV_VALIDATION_ERROR
        message:
          type: string
        row_index:
          type: integer
          minimum: 1
          description: 오류 발생 행 번호 (헤더=1행 기준)
        reason:
          type: string

    CycleDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - status
        - start_at
        - end_at
        - reviewer_notice_message
        - total_assignments_count
        - submitted_assignments_count
        - completion_rate
        - is_all_submitted
        - is_deadline_passed
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        title:
          type: string
        status:
          $ref: "#/components/schemas/CycleStatus"
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        reviewer_notice_message:
          type: string
        total_assignments_count:
          type: integer
          minimum: 0
        submitted_assignments_count:
          type: integer
          minimum: 0
        completion_rate:
          type: integer
          minimum: 0
          maximum: 100
        is_all_submitted:
          type: boolean
        is_deadline_passed:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CycleListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CycleDetail"

    CreateCycleRequest:
      type: object
      additionalProperties: false
      required: [title, start_at, end_at]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        reviewer_notice_message:
          type: string
          maxLength: 5000

    UpdateCycleRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        reviewer_notice_message:
          type: string
          maxLength: 5000

    CloseCycleRequest:
      type: object
      additionalProperties: false
      properties:
        require_all_submitted:
          type: boolean
          default: false
          description: 전원 제출 완료 필수 여부

    CycleStatusDetailResponse:
      type: object
      additionalProperties: false
      required: [cycle, reviewer_progress]
      properties:
        cycle:
          $ref: "#/components/schemas/CycleDetail"
        reviewer_progress:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - reviewer
              - total_count
              - submitted_count
              - is_all_done
              - unsubmitted_reviewees
            properties:
              reviewer:
                $ref: "#/components/schemas/Member"
              total_count:
                type: integer
                minimum: 0
              submitted_count:
                type: integer
                minimum: 0
              is_all_done:
                type: boolean
              unsubmitted_reviewees:
                type: array
                items:
                  $ref: "#/components/schemas/Member"

    QuestionOption:
      type: object
      additionalProperties: false
      required: [id, question_id, display_order, option_text]
      properties:
        id:
          type: integer
          minimum: 1
        question_id:
          type: integer
          minimum: 1
        display_order:
          type: integer
          minimum: 1
        option_text:
          type: string

    Question:
      type: object
      additionalProperties: false
      required:
        - id
        - cycle_id
        - display_order
        - question_type
        - scale_type
        - category
        - content
        - image_url
        - options
        - created_at
      properties:
        id:
          type: integer

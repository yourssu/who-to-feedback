      responses:
        "202":
          description: 실패 건 재시도 큐 등록 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedCountResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/reviewer/dashboard:
    get:
      tags: [reviewer]
      operationId: getReviewerDashboard
      summary: 리뷰어 배정 목록 및 진행률 조회

      summary: 배정된 리뷰 문항 및 작성 답변 조회
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AssignmentIdPath"
      responses:
        "200":
          description: 설문 문항 및 기존 답변(임시저장·제출본) 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerAssignmentFormResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/reviewer/assignments/{assignmentId}/draft:
    put:
      tags: [reviewer]
      operationId: saveReviewerDraft
      summary: 리뷰 답변 임시 저장
      description: 미제출 리뷰 답변 부분 저장 (최대 100KB)
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/AssignmentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAnswersInput"
      responses:
        "200":
          description: 임시 저장 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSavedResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

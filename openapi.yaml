        - cookieAuth: []
      responses:
        "200":
          description: 리뷰어 대시보드 데이터 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerDashboardResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":

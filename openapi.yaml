openapi: 3.1.0
info:
  title: PeerFlow API
  version: 2.0.0
  summary: 비공개 피어리뷰 수집 및 리포트 배포 API
  description: Cloudflare Workers + D1 + R2 + Queues 기반 피어리뷰 시스템 REST API 명세
  license:
    name: Proprietary
servers:
  - url: https://api.peerflow.example.com
    description: 운영 서버 (Cloudflare Workers)
  - url: http://localhost:8787
    description: 로컬 개발 서버 (Wrangler)

tags:
  - name: system
    description: 헬스 체크 및 시스템 상태
  - name: auth
    description: 초기 설정, 로그인·로그아웃 및 세션 조회
  - name: members
    description: 팀원 등록, 조회, 삭제 및 CSV 일괄 업로드
  - name: cycles
    description: 회차 생성, 조회, 상태 전환 및 리마인더 발송
  - name: questions
    description: 설문 문항 및 객관식 선택지 관리
  - name: assignments
    description: 리뷰어-피평가자 매칭 관리
  - name: reports
    description: 리포트(HTML·PDF) 조회, 미리보기, 재생성 및 발송 승인
  - name: deliveries
    description: Slack DM 발송 이력 조회 및 실패 건 재시도
  - name: reviewer
    description: 리뷰어 대시보드, 설문 조회, 임시 저장 및 제출
  - name: media
    description: 문항 첨부 이미지 스트리밍 조회

paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: 서버 및 DB 상태 확인
      security: []
      responses:
        "200":
          description: 정상 상태 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/auth/setup-status:
    get:
      tags: [auth]
      operationId: getSetupStatus
      summary: 최초 관리자 설정 필요 여부 조회
      security: []
      responses:
        "200":
          description: 초기 설정 필요 여부 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"

  /api/auth/setup:
    post:
      tags: [auth]
      operationId: createInitialAdmin
      summary: 최초 관리자 계정 생성
      description: 미설정 상태에서 최초 관리자 생성 및 세션 즉시 발급
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitialAdminSetupRequest"
      responses:
        "201":
          description: 최초 관리자 생성 및 세션 발급 완료
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/auth/admin/login:
    post:
      tags: [auth]
      operationId: loginAdmin
      summary: 관리자 로그인
      description: 아이디·비밀번호 기반 관리자 인증 및 세션 발급
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: 관리자 로그인 성공
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /api/auth/reviewer/login:
    post:
      tags: [auth]
      operationId: loginReviewer
      summary: 리뷰어 6자리 PIN 로그인
      description: 진행 중(ACTIVE) 회차의 6자리 PIN 인증 및 세션 발급
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewerPinLoginRequest"
      responses:
        "200":
          description: 리뷰어 로그인 성공
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 세션 로그아웃
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        "204":
          description: 세션 삭제 및 쿠키 만료 완료

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentSession
      summary: 현재 로그인 세션 및 CSRF 토큰 조회
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 현재 세션 정보 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/admin/members:
    get:
      tags: [members]
      operationId: listMembers
      summary: 전체 팀원 목록 조회
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 팀원 목록 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      tags: [members]
      operationId: createMember
      summary: 팀원 단건 등록
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
      responses:
        "201":
          description: 팀원 등록 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/admin/members/import-csv:
    post:
      tags: [members]
      operationId: importMembersCsv
      summary: 팀원 CSV 일괄 등록 및 업데이트
      description: 이메일 기준 팀원 Upsert 처리 (최대 2MB, 10,000행, UTF-8/EUC-KR)
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [csv_file]
              properties:
                csv_file:
                  type: string
                  format: binary
                  description: 팀원 CSV 파일 (.csv)
      responses:
        "200":
          description: CSV 일괄 처리 결과 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResultResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "422":
          description: CSV 행 데이터 유효성 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvValidationErrorResponse"

  /api/admin/members/{memberId}:
    delete:
      tags: [members]
      operationId: deleteMember
      summary: 팀원 삭제
      description: 매칭 및 리포트 이력이 없는 팀원 삭제
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/MemberIdPath"
      responses:
        "204":
          description: 팀원 삭제 완료
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/admin/cycles:
    get:
      tags: [cycles]
      operationId: listCycles
      summary: 전체 회차 목록 조회
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 회차 목록 및 요약 통계 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      tags: [cycles]
      operationId: createCycle
      summary: 신규 회차 생성
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCycleRequest"
      responses:
        "201":
          description: 회차(DRAFT) 생성 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleDetail"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/admin/cycles/{cycleId}:
    get:
      tags: [cycles]
      operationId: getCycle
      summary: 회차 상세 및 리뷰어별 제출 현황 조회
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CycleIdPath"
      responses:
        "200":
          description: 회차 상세 및 리뷰어 진행 현황 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleStatusDetailResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags: [cycles]
      operationId: updateCycle
      summary: 회차 기본 정보 및 안내 문구 수정
      description: 제목·일시(DRAFT 전용) 및 리뷰어 안내 문구(CLOSED 이전) 수정
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CycleIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCycleRequest"
      responses:
        "200":
          description: 수정된 회차 정보 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleDetail"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/admin/cycles/{cycleId}/start:
    post:
      tags: [cycles]
      operationId: startCycle
      summary: 회차 시작 및 PIN 발급·발송
      description: DRAFT → ACTIVE 상태 전환, 리뷰어 PIN 발급 및 Slack DM 발송 큐 등록
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CycleIdPath"
      responses:
        "200":
          description: 회차 시작 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleDetail"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/admin/cycles/{cycleId}/close:
    post:
      tags: [cycles]
      operationId: closeCycle
      summary: 회차 마감 및 전체 리포트 생성 요청
      description: ACTIVE → COMPLETED 상태 전환 및 피평가자별 HTML·PDF 생성 큐 등록
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CycleIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseCycleRequest"
      responses:
        "202":
          description: 회차 마감 및 리포트 생성 큐 등록 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleDetail"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/admin/cycles/{cycleId}/reminders:
    post:
      tags: [cycles]
      operationId: sendCycleReminders
      summary: 미제출 리뷰어 리마인더 발송 요청
      description: ACTIVE 회차 미제출 리뷰어 대상 Slack DM 발송 큐 등록
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CycleIdPath"
      responses:
        "202":
          description: 리마인더 발송 큐 등록 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedCountResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/admin/cycles/{cycleId}/questions:
    get:
      tags: [questions]
      operationId: listCycleQuestions
      summary: 회차별 설문 문항 및 선택지 목록 조회
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CycleIdPath"
      responses:
        "200":
          description: 문항 목록 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    post:
      tags: [questions]
      operationId: createQuestion
      summary: 설문 문항 추가
      description: DRAFT 회차 문항 추가 (선택적 참고 이미지 R2 업로드 포함)
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CycleIdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateQuestionMultipartRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionJsonRequest"
      responses:
        "201":
          description: 문항 생성 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"

  /api/admin/questions/{questionId}:
    delete:
      tags: [questions]
      operationId: deleteQuestion
      summary: 설문 문항 삭제
      description: DRAFT 회차 문항 및 첨부 R2 이미지 삭제
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/QuestionIdPath"
      responses:
        "204":
          description: 문항 삭제 완료
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/admin/questions/{questionId}/options:
    post:
      tags: [questions]
      operationId: createQuestionOption
      summary: 객관식 선택지 추가
      description: DRAFT 회차 객관식 문항 선택지 등록
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/QuestionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionOptionRequest"
      responses:
        "201":
          description: 선택지 추가 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionOption"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/admin/options/{optionId}:
    delete:
      tags: [questions]
      operationId: deleteQuestionOption
      summary: 객관식 선택지 삭제
      description: DRAFT 회차 객관식 문항 선택지 삭제
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/OptionIdPath"
      responses:
        "204":
          description: 선택지 삭제 완료
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/admin/cycles/{cycleId}/assignments:
    get:
      tags: [assignments]
      operationId: listCycleAssignments
      summary: 회차별 리뷰 매칭 목록 조회
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CycleIdPath"
      responses:
        "200":
          description: 매칭 목록 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    post:
      tags: [assignments]
      operationId: createAssignment
      summary: 개별 리뷰 매칭 추가
      description: DRAFT·ACTIVE 회차 매칭 추가 (ACTIVE 시 신규 리뷰어 PIN 즉시 발급)
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CycleIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
      responses:
        "201":
          description: 매칭 생성 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSummary"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/admin/cycles/{cycleId}/assignments/auto-match:
    post:
      tags: [assignments]
      operationId: autoMatchAssignments
      summary: 리뷰 매칭 자동 생성
      description: 전체 교차(ALL) 또는 동일 부서(SAME_DEPARTMENT) 기준 일괄 매칭
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CycleIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoMatchAssignmentsRequest"
      responses:
        "200":
          description: 자동 매칭 생성 건수 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoMatchResultResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

